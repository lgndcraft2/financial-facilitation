name: Format Pull Request

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - dev
      - stage
      - main

permissions:
  contents: write

jobs:
  format:
    name: Apply Prettier formatting
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format pull request files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          mapfile -t FILES < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -E '\.(cjs|js|json|md|mjs|mts|ts|tsx|yaml|yml)$' || true)

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No supported files changed."
            exit 0
          fi

          npx prettier --write "${FILES[@]}"

      - name: Commit formatting changes
        run: |
          set -e
          if git diff --quiet; then
            echo "Formatting is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: format pull request files"
          git push
